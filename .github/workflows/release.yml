name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.3.0
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: macos-14
            platform: macOS-AppleSilicon
          - os: macos-15-intel
            platform: macOS-Intel
          - os: ubuntu-24.04
            platform: Linux
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.renderer-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: "3.12"
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-gi-cairo gir1.2-webkit2-4.1 gir1.2-gtk-3.0 libgirepository1.0-dev xvfb
          python3 -m venv --system-site-packages .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Python dependencies
        run: python -m pip install -r requirements.txt imageio-ffmpeg
      - name: Rendering browser
        run: |
          python -m playwright install chromium --only-shell
          python -m playwright install firefox
      - name: Build
        run: python build.py
      - name: Windows local browser check
        if: runner.os == 'Windows'
        run: python tests/smoke_local_ui.py dist/SonaLoop.exe
      - name: macOS local browser check
        if: runner.os == 'macOS'
        run: python tests/smoke_local_ui.py dist/SonaLoop.app/Contents/MacOS/SonaLoop
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts
          Copy-Item dist/SonaLoop.exe artifacts/SonaLoop-Windows.exe
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent dist/SonaLoop.app artifacts/SonaLoop-${{ matrix.platform }}.zip
      - name: Linux local browser check
        if: runner.os == 'Linux'
        run: python tests/smoke_local_ui.py dist/SonaLoop/SonaLoop
      - name: Package Linux and Ubuntu
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts packaging/DEBIAN packaging/opt packaging/usr/share/applications packaging/usr/share/icons/hicolor/256x256/apps
          tar -czf artifacts/SonaLoop-Linux-x86_64.tar.gz -C dist SonaLoop
          cp -r dist/SonaLoop packaging/opt/sonaloop
          cp logo.png packaging/usr/share/icons/hicolor/256x256/apps/sonaloop.png
          printf '[Desktop Entry]\nType=Application\nName=SonaLoop\nExec=/opt/sonaloop/SonaLoop\nIcon=sonaloop\nCategories=AudioVideo;Graphics;\nTerminal=false\n' > packaging/usr/share/applications/sonaloop.desktop
          printf 'Package: sonaloop\nVersion: 1.3.0\nArchitecture: amd64\nMaintainer: odiwr <noreply@github.com>\nDepends: libwebkit2gtk-4.1-0, gir1.2-webkit2-4.1, gir1.2-gtk-3.0, libnss3, libnspr4, libatk-bridge2.0-0, libxkbcommon0, libgbm1, libasound2t64\nDescription: A small unofficial 360sona video and GIF exporter\n' > packaging/DEBIAN/control
          dpkg-deb --build --root-owner-group packaging artifacts/sonaloop-1.3.0-ubuntu-amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: SonaLoop-${{ matrix.platform }}
          path: artifacts/*
      - name: Upload release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: gh release upload "$TAG" artifacts/* --clobber
